<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Option pricing and fixed income dashboard powered by C++20 engines — Black-Scholes, Binomial Trees, Monte Carlo, Finite Differences, and Heston.">
    <meta property="og:title" content="Quant Finance Dashboard">
    <meta property="og:description" content="Interactive option pricing and bond analytics powered by C++ numerical engines.">
    <title>{% block title %}Quant Finance Dashboard{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="accent-stripe"></div>
    <nav class="main-nav">
      <div class="nav-inner">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Options Pricing</a>
        <a href="/bonds" class="nav-link {% if request.path == '/bonds' %}active{% endif %}">Fixed Income</a>
      </div>
    </nav>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
    <footer class="main-footer">
      <p>Built with C++20 &amp; Python &middot; Pricing powered by Black-Scholes, Binomial Trees, Monte Carlo, Finite Differences &amp; Heston</p>
      <p><a href="https://github.com/Claudio911015/Quant_Finance" target="_blank" rel="noopener">GitHub</a> &middot; Claudio P. &copy; 2025–2026</p>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
